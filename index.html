<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사주동물원이 이사했어요</title>
<!-- 2026-10-05 이사 페이지 — 사주동물원은 https://soldamlab.com/zoo/ 로 옮겼다.
     이 주소(dahyeonjang.github.io/zoo)에 쌓인 동물원은 이 브라우저 저장소(zoo_v1)에만 있다. 주소가 바뀌면 저장소가 따로라서
     그냥 넘기면 빈 동물원이 뜬다 → 여기서 읽어 #m= 옮기는 주소에 실어 넘긴다(앱의 「다른 브라우저로 열기」와 같은 모양).
     · 친구는 기둥만 싣고 생년월일은 안 싣는다(앱 9-9장 규칙 그대로) · 받는 쪽에 동물원이 있으면 앱이 덮어쓰지 않는다
     · 이 주소의 기록은 지우지 않는다 · 초대·회신 링크(#i= #b= 등)로 왔으면 그 주소를 그대로 넘긴다 -->
<meta name="description" content="링크 하나로 서로의 동물 궁합. 가입 없이 생일만 넣으면 돼요.">
<meta property="og:type" content="website">
<meta property="og:title" content="친구는 무슨 동물일까? · 사주동물원">
<meta property="og:description" content="링크 하나로 서로의 동물 궁합. 가입 없이 생일만 넣으면 돼요.">
<meta property="og:url" content="https://soldamlab.com/zoo/">
<meta property="og:image" content="https://soldamlab.com/zoo/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://soldamlab.com/zoo/">
<style>
:root{--bg:#FBF7EF;--ink:#3A3128;--sub:#8B7E6D;--pt:#F0885A}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6}
.w{max-width:440px;margin:0 auto;padding:56px 20px;text-align:center}
h1{font-size:22px;margin:14px 0 8px;letter-spacing:-.02em}
p{margin:6px 0;color:var(--sub);font-size:14.5px;word-break:keep-all}
a.b{display:block;margin:22px 0 0;background:var(--pt);color:#fff;font-weight:800;border-radius:16px;padding:15px;text-decoration:none}
.n{margin-top:18px;font-size:12.5px}
</style>
</head>
<body>
<div class="w">
  <div style="font-size:44px">🐾</div>
  <h1>사주동물원이 이사했어요</h1>
  <p>새 주소 <b>soldamlab.com/zoo</b> 로 옮겨 갑니다.</p>
  <p id="carry"></p>
  <a class="b" id="go" href="https://soldamlab.com/zoo/">새 주소로 가기</a>
  <p class="n">홈 화면에 아이콘을 두셨다면, 새 주소에서 <b>한 번 더 추가</b>해 주세요. 옛 아이콘은 지워도 돼요.</p>
</div>
<script>
(function(){
  var NEW = "https://soldamlab.com/zoo/";
  // 이 PC 시험에서만: ?to=새주소 (localhost에서만 먹는다)
  var qto = new URLSearchParams(location.search).get("to");
  if (qto && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) NEW = qto;
  function b64e(s){
    var bytes = new TextEncoder().encode(s), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  var hash = location.hash || "", target = NEW, n = 0, name = "";
  if (hash && hash !== "#") {
    target = NEW + hash;                       // 초대·회신·데모 링크는 그대로 넘긴다
  } else {
    try {
      var d = JSON.parse(localStorage.getItem("zoo_v1") || "null");
      if (d && d.me && d.me.saju) {
        var f = (d.friends || []).map(function(x){
          return { n:x.name, c:x.cat||null, u:x.sub||null, s:x.saju.stems, b:x.saju.branches };
        });
        target = NEW + "#m=" + b64e(JSON.stringify({ me:d.me, f:f }));
        n = f.length; name = d.me.name || "";
      }
    } catch (e) {}
  }
  document.getElementById("go").href = target;
  if (name) document.getElementById("carry").innerHTML = "<b>" + name.replace(/[<>&]/g,"") + "</b>의 동물원도 같이 옮겨 가요 · 친구 " + n + "명";
  else if (hash && hash !== "#") document.getElementById("carry").textContent = "받으신 링크 그대로 새 주소에서 열려요.";
  setTimeout(function(){ location.replace(target); }, 1800);
})();
</script>
</body>
</html>
